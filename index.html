<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="御剑伏妖">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/app-192.png">
<link rel="icon" href="assets/icons/app-192.png">
<title>御剑伏妖 · 五百关 · 妖界无尽篇</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0c0a12;overflow:hidden;
    font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","SimSun",serif;
    -webkit-user-select:none;user-select:none;}
  #game{display:block;touch-action:none;}
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;}
  .screen.active{display:flex;}
  .panel{background:linear-gradient(160deg,rgba(28,22,42,.97),rgba(15,12,24,.97));
    border:1px solid #8a6d2f;border-radius:16px;padding:30px 44px;text-align:center;
    box-shadow:0 0 46px rgba(0,0,0,.65), inset 0 0 22px rgba(138,109,47,.18);color:#e8dcc0;max-width:92vw;}
  h1{font-size:60px;margin:0 0 4px;color:#f0d890;letter-spacing:12px;text-shadow:0 0 26px rgba(240,190,90,.4);font-weight:400;}
  .sub{color:#9c8fb8;font-size:16px;margin-bottom:18px;letter-spacing:4px;}
  .hint{color:#7d7396;font-size:14px;margin-top:16px;line-height:1.9;}
  .btn{display:inline-block;margin:8px 6px;padding:10px 30px;font-size:20px;letter-spacing:3px;cursor:pointer;
    color:#ecd9a0;background:linear-gradient(180deg,#2b2340,#1a1428);border:1px solid #8a6d2f;border-radius:10px;
    font-family:inherit;transition:all .15s;}
  .btn:hover{border-color:#e8c86a;color:#ffe9ad;box-shadow:0 0 14px rgba(232,200,106,.35);transform:translateY(-1px);}
  .btn.small{font-size:15px;padding:6px 18px;}
  #lv-grid{display:grid;grid-template-columns:repeat(10,64px);gap:12px;justify-content:center;margin:14px 0 6px;
    max-height:318px;overflow-y:auto;padding:4px;}
  #lv-hidden{display:grid;grid-template-columns:repeat(10,64px);gap:12px;justify-content:center;margin:6px 0 2px;}
  .hidden-tease{margin-top:12px;color:#6d5f8a;font-size:15px;letter-spacing:2px;}
  .hidden-label{color:#c9a0ff;font-size:15px;margin-top:10px;letter-spacing:3px;}
  @media (max-width:760px){
    .panel{padding:18px 14px;max-width:96vw;}
    h1{font-size:36px;letter-spacing:6px;}
    .sub{font-size:12px;letter-spacing:2px;}
    #lv-grid{grid-template-columns:repeat(5,58px);gap:9px;max-height:42vh;}
    .lvbtn{width:58px;height:58px;font-size:22px;}
    .card{width:150px;}
    .btn{font-size:17px;padding:8px 20px;}
    .hint{font-size:12px;line-height:1.7;}
    #clear-title,#over-title{font-size:30px;}
  }
  .lvbtn{width:64px;height:64px;font-size:26px;color:#ecd9a0;background:linear-gradient(180deg,#2b2340,#191327);
    border:1px solid #6d5728;border-radius:12px;cursor:pointer;font-family:inherit;transition:all .15s;line-height:1.1;}
  .lvbtn:hover{border-color:#e8c86a;box-shadow:0 0 12px rgba(232,200,106,.4);transform:translateY(-2px);}
  .lvbtn.locked{opacity:.32;cursor:not-allowed;}
  .lvbtn.locked:hover{border-color:#6d5728;box-shadow:none;transform:none;}
  .lvbtn .bn{font-size:12px;color:#9c8fb8;display:block;margin-top:2px;}
  #cards{display:flex;gap:18px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .card{width:196px;padding:20px 14px 16px;background:linear-gradient(180deg,#2b2340,#181226);
    border:1px solid #6d5728;border-radius:14px;cursor:pointer;color:#e8dcc0;transition:all .15s;text-align:center;}
  .card:hover{border-color:#e8c86a;transform:translateY(-4px);box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 16px rgba(232,200,106,.3);}
  .card .ic{font-size:40px;line-height:1.2;}
  .card .ic img{width:48px;height:48px;filter:drop-shadow(0 0 6px rgba(255,220,140,0.45));vertical-align:middle;}
  .card .nm{font-size:21px;color:#f0d890;margin:8px 0 6px;letter-spacing:2px;}
  .card .ds{font-size:14px;color:#9c8fb8;line-height:1.6;}
  .stats{font-size:17px;color:#c9bfae;line-height:2;margin:10px 0 4px;letter-spacing:1px;}
  .stats b{color:#f0d890;}
  #mute,#pausebtn{position:fixed;right:14px;z-index:20;width:44px;height:44px;border-radius:50%;
    background:rgba(30,24,46,.8);border:1px solid #6d5728;color:#ecd9a0;font-size:19px;cursor:pointer;}
  #mute{bottom:12px;}
  #save-row{display:flex;gap:10px;justify-content:center;margin:12px 0 0;}
  #btn-new{color:#c98f8f;border-color:#7a4444;}
  #btn-new.confirm{color:#ffd0d0;background:#5a2020;border-color:#c06060;}
  #name-row{display:flex;gap:8px;justify-content:center;margin:10px 0 2px;}
  #name-input{width:150px;padding:8px 10px;font-family:inherit;font-size:15px;color:#f0d890;
    background:#17121f;border:1px solid #6d5728;border-radius:8px;text-align:center;}
  #rank-list .rk{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #3a2f50;padding:2px 4px;}
  #rank-list .rk.me{color:#ffe9ad;background:rgba(216,178,74,0.08);}
  #rank-list .rk .n{flex:1;}
  #pausebtn{bottom:66px;font-size:15px;letter-spacing:1px;}
  #mute:hover,#pausebtn:hover{border-color:#e8c86a;}
  .gold{color:#f0d890;}
  #clear-title,#over-title{font-size:44px;margin:0 0 4px;letter-spacing:6px;}
</style>

<body>
<canvas id="game"></canvas>

<div class="screen active" id="scr-menu">
  <div class="panel">
    <h1>御剑伏妖</h1>
    <div class="sub">—— 万 妖 乱 世 · 五 百 关 · 第 100 关 灵 宠 降 临 ——</div>
    <div id="save-row">
      <button class="btn" id="btn-continue" style="display:none;">继续游戏</button>
      <button class="btn small" id="btn-new" style="display:none;">重新修行</button>
    </div>
    <div id="name-row">
      <input id="name-input" maxlength="8" placeholder="输入侠名">
      <button class="btn small" id="btn-rank">排行榜</button>
    </div>
    <div id="lv-grid"></div>
    <div id="hidden-area"></div>
    <div class="hint">
      移动：鼠标指引（角色追随光标）/ WASD / 手机滑屏 &nbsp;·&nbsp; 飞剑自动御敌<br>
      「停」按钮或 P 键暂停 &nbsp;·&nbsp; M 静音 &nbsp;·&nbsp; 升级时按 1 / 2 / 3 快速选卡
    </div>
  </div>
</div>

<div class="screen" id="scr-levelup">
  <div class="panel">
    <h1 style="font-size:36px;letter-spacing:6px;">剑 术 精 进</h1>
    <div class="sub">择一而修</div>
    <div id="cards"></div>
    <div class="hint">按 1 / 2 / 3 快速选择</div>
  </div>
</div>

<div class="screen" id="scr-clear">
  <div class="panel">
    <h1 id="clear-title">关卡通关</h1>
    <div class="sub" id="clear-sub"></div>
    <div class="stats" id="clear-stats"></div>
    <div>
      <button class="btn" id="btn-next">下一关</button>
      <button class="btn small" id="btn-replay-clear">重玩本关</button>
      <button class="btn small" id="btn-menu-clear">返回山门</button>
    </div>
  </div>
</div>

<div class="screen" id="scr-over">
  <div class="panel">
    <h1 id="over-title" style="color:#d86a6a;">挑战失利</h1>
    <div class="sub">妖气反噬，道心受挫……</div>
    <div class="stats" id="over-stats"></div>
    <div>
      <button class="btn" id="btn-retry">重整旗鼓</button>
      <button class="btn small" id="btn-menu-over">返回山门</button>
    </div>
  </div>
</div>

<div class="screen" id="scr-rank">
  <div class="panel">
    <h1 style="font-size:40px;">天 外 榜</h1>
    <div class="sub">—— 全服剑修过关进度 ——</div>
    <div id="rank-list" style="min-height:200px;max-height:46vh;overflow-y:auto;text-align:left;font-size:15px;line-height:2;"></div>
    <div><button class="btn small" id="btn-rank-refresh">刷新</button>
    <button class="btn small" id="btn-rank-back">返回</button></div>
    <div style="margin-top:10px;font-size:12px;color:#6d5f8a;">
      想上榜？把成绩发给房主，或粘贴上报密钥（房主专用）：
      <div style="margin-top:6px;"><input id="lb-token-input" placeholder="粘贴上报密钥" style="width:70%;padding:6px 8px;font-size:12px;color:#e8dcc0;background:#17121f;border:1px solid #6d5728;border-radius:6px;">
      <button class="btn small" id="btn-lb-token">存</button></div>
    </div>
  </div>
</div>
<div class="screen" id="scr-pause">
  <div class="panel">
    <h1 style="font-size:40px;">暂 停</h1>
    <div class="sub">闭目调息</div>
    <div>
      <button class="btn" id="btn-resume">继续</button>
      <button class="btn small" id="btn-menu-pause">返回山门</button>
    </div>
  </div>
</div>

<button id="pausebtn" title="暂停 (P)">停</button>
<button id="mute" title="静音 (M)">♪</button>

<script>
'use strict';
/* ================= 基础工具 ================= */
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
function pickW(list) { // list: [[item,weight],...]
  let s = 0; for (const it of list) s += it[1];
  let r = Math.random() * s;
  for (const it of list) { r -= it[1]; if (r <= 0) return it[0]; }
  return list[0][0];
}
function hash2(x, y) { let n = (x | 0) * 374761393 + (y | 0) * 668265263; n = (n ^ (n >> 13)) * 1274126177; return ((n ^ (n >> 16)) >>> 0) / 4294967295; }
window.__errs = [];
addEventListener('error', e => { window.__errs.push(String(e.message)); });

/* ================= 音效（WebAudio 合成） ================= */
let AC = null, muted = false, lastHitSfx = 0;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } return AC; }
function tone(freq, dur, type = 'square', vol = 0.12, slide = 0, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  hit() { const n = performance.now(); if (n - lastHitSfx < 60) return; lastHitSfx = n; tone(190 + rand(80), 0.05, 'square', 0.07, -60); },
  kill() { tone(320, 0.1, 'square', 0.1, -180); tone(160, 0.14, 'sawtooth', 0.06, -90, 0.03); },
  pickup() { tone(660, 0.07, 'sine', 0.09, 260); },
  heal() { tone(523, 0.12, 'sine', 0.1, 160); tone(784, 0.14, 'sine', 0.08, 120, 0.08); },
  hurt() { tone(120, 0.25, 'sawtooth', 0.16, -60); },
  levelup() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.14, 'triangle', 0.12, 0, i * 0.08)); },
  click() { tone(440, 0.05, 'triangle', 0.08); },
  boss() { tone(70, 0.7, 'sawtooth', 0.2, -25); tone(55, 0.8, 'square', 0.14, -20, 0.1); },
  slam() { tone(90, 0.3, 'sawtooth', 0.2, -50); },
  win() { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, 0.16, 'triangle', 0.11, 0, i * 0.11)); },
};

/* ================= 背景音乐：中式古典（五声音阶 · 古筝与笛箫，实时生成） ================= */
const BGM = { playing: false, timer: null, nextT: 0, step: 0, bpm: 76 };
// 六首曲目（每 50 关换一首）：主奏 / 拨弦 / 中声部 / 钟 · 速度各异
const SONGS = [
  { bpm: 76, lead: ['flute', ['A4', 'D5', 'E5', 'G5']],            pluck: ['koto', ['A3', 'D4', 'E4', 'G4']],            mid: ['violin', ['A3', 'C4', 'E4']],        bell: ['bells', ['C4', 'E4', 'G4']] },   // 灵谷晨曲
  { bpm: 72, lead: ['celesta', ['A4', 'C5', 'E5', 'G5']],          pluck: ['harp', ['A3', 'C4', 'D4', 'E4', 'G4']],      mid: ['choir', ['A3', 'C4', 'E4', 'G4']],   bell: ['bells', ['C4', 'E4', 'G4']] },   // 仙音缥缈
  { bpm: 92, lead: ['koto', ['A3', 'D4', 'E4', 'G4']],             pluck: ['shamisen', ['A3', 'C4', 'D4', 'E4', 'G4']],  mid: ['violin', ['A3', 'C4', 'E4']],        bell: ['bells', ['C4', 'E4', 'G4']] },   // 百妖夜行
  { bpm: 70, lead: ['music_box', ['A4', 'C5', 'D5', 'E5', 'G5']],  pluck: ['harp', ['A3', 'C4', 'D4', 'E4', 'G4']],      mid: ['flute', ['A4', 'D5', 'E5', 'G5']],   bell: ['celesta', ['A4', 'C5', 'E5', 'G5']] }, // 幽篁独坐
  { bpm: 78, lead: ['violin', ['A3', 'C4', 'E4', 'G4']],           pluck: ['harpsichord', ['A3', 'C4', 'D4', 'E4', 'G4']], mid: ['choir', ['A3', 'C4', 'E4', 'G4']], bell: ['bells', ['C4', 'E4', 'G4']] }, // 镇妖古调
  { bpm: 84, lead: ['choir', ['A3', 'C4', 'E4', 'G4']],            pluck: ['harp', ['A3', 'C4', 'D4', 'E4', 'G4']],      mid: ['violin', ['A3', 'C4', 'E4']],        bell: ['bells', ['C4', 'E4', 'G4']] },   // 天外天
];
const PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];      // 宫调五声音阶
const PENT_MIN = [0, 2, 3, 7, 8, 12, 14, 15, 19, 20, 24];  // 羽调式（BOSS 战）
const PHRASES = [
  [0, 1, 2, -1, 3, 2, 1, -1],
  [2, 3, 4, -1, 5, 4, 3, -1],
  [4, 3, 2, 1, 2, 3, 1, -1],
  [3, 2, 1, 2, 0, -1, -1, -1],
];
function bgmStart() {
  if (BGM.playing) return;
  const a = ac(); if (!a) return;
  BGM.playing = true;
  BGM.nextT = a.currentTime + 0.1;
  BGM.timer = setInterval(bgmTick, 120);
  loadSamples();
}
// 采样缓存（开源乐器采样：MusyngKite / FluidR3 系列音色库）
const SAMP_BUF = {};
let SAMP_STARTED = false;
const KOTO = ['A3', 'D4', 'E4', 'G4'];
const FLUTE = ['A4', 'D5', 'E5', 'G5'];
const VIOLIN = ['A3', 'C4', 'E4'];
const BELLS = ['C4', 'E4', 'G4'];
function loadSamples() {
  if (SAMP_STARTED) return;
  SAMP_STARTED = true;
  const a = ac(); if (!a) return;
  const set = new Set();
  SONGS.forEach(function (sg) {
    [sg.lead, sg.pluck, sg.mid, sg.bell].forEach(function (pc) {
      pc[1].forEach(function (n) { set.add(pc[0] + '_' + n); });
    });
  });
  set.forEach(function (key) {
    fetch('assets/samples/' + key + '.mp3')
      .then(function (r) { return r.arrayBuffer(); })
      .then(function (b) { return a.decodeAudioData(b); })
      .then(function (buf) { SAMP_BUF[key] = buf; })
      .catch(function () { });
  });
}
function playSample(inst, note, t, rate, vol) {
  const a = ac();
  const buf = SAMP_BUF[inst + '_' + note];
  if (!buf) return false;
  const s = a.createBufferSource();
  s.buffer = buf; s.playbackRate.value = rate;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol * 0.3), t + 0.5);
  s.connect(g); g.connect(a.destination);
  s.start(t); s.stop(t + Math.min((buf.duration || 1) / rate, 3));
  return true;
}
function bgmTick() {
  const a = ac(); if (!a || muted) return;
  const sp = 60 / BGM.bpm / 2; // 八分音符
  while (BGM.nextT < a.currentTime + 0.45) {
    bgmStep(BGM.step, BGM.nextT, sp);
    BGM.step++;
    BGM.nextT += sp;
  }
}
function bgmNote(freq, t, dur, type, vol, vib) {
  const a = ac();
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (vib) {
    const lfo = a.createOscillator(), lg = a.createGain();
    lfo.frequency.value = 5.5; lg.gain.value = freq * 0.009;
    lfo.connect(lg); lg.connect(o.frequency);
    lfo.start(t); lfo.stop(t + dur);
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (vib ? 0.06 : 0.015));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function bgmStep(step, t, sp) {
  const inBattle = window.G && (G.state === 'playing' || G.state === 'levelup');
  const bossFight = inBattle && G.boss && G.boss.dying < 0;
  const song = SONGS[Math.min(SONGS.length - 1, Math.floor((Math.max(1, window.G ? G.level : 1) - 1) / 50))];
  BGM.bpm = song.bpm;
  const sc = bossFight ? PENT_MIN : PENT;
  const bar = Math.floor(step / 8) % 4, pos = step % 8;
  const rootI = [0, 3, 2, 4][bar];
  const rootF = 293.66 * Math.pow(2, sc[rootI] / 12);
  // 拨弦（筝/竖琴/三味线/羽管键琴，随章节）
  if (pos % 2 === 0) {
    const [pi, pn] = song.pluck;
    if (!playSample(pi, pn[(pos / 2 + rootI) % pn.length], t, 1, 0.17))
      bgmNote(rootF, t, sp * 1.6, 'triangle', 0.075, false);
  }
  // 主奏旋律（笛/钟琴/八音盒/合唱，随章节）
  const ph = PHRASES[Math.floor(step / 32) % PHRASES.length][pos];
  if (ph >= 0 && Math.floor(step / 8) % 2 === 1) {
    const [li, ln] = song.lead;
    if (!playSample(li, ln[ph % ln.length], t, 2, 0.1))
      bgmNote(293.66 * 2 * Math.pow(2, sc[(rootI + ph) % sc.length] / 12), t, sp * 2.2, 'sine', 0.065, true);
  }
  // 中声部（二胡/合唱/长笛）
  if (step % 16 === 8) {
    const [mi, mn] = song.mid;
    if (!playSample(mi, mn[rootI % mn.length], t, 1, 0.08))
      bgmNote(rootF * 1.5, t, sp * 13, 'triangle', 0.04, true);
  }
  // 编钟：段落起钟
  if (step % 32 === 0) {
    const [bi2, bn] = song.bell;
    if (!playSample(bi2, bn[bar % bn.length], t, 1, 0.085)) {
      const bf = rootF * 3;
      bgmNote(bf, t, sp * 10, 'sine', 0.045, false);
      bgmNote(bf * 2.76, t, sp * 6, 'sine', 0.02, false);
    }
  }
  // 木鱼：战斗弱拍
  if (bossFight && (pos === 3 || pos === 7)) tone(900, 0.03, 'triangle', 0.025, -300);
  // BOSS 战低音鼓
  if (bossFight && pos % 4 === 0) tone(70, 0.12, 'sine', 0.09, -30);
  // 低音垫
  if (step % 32 === 0) bgmNote(rootF / 2, t, sp * 30, 'sine', 0.05, false);
}

/* ================= 画布 ================= */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, W < 760 ? 1.5 : 2); // 手机端限 DPR 保帧率
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

function castSkill(type, g) {
  const p = G.player, dm = p.dmgMul;
  if (type === 'charge') {
    let best = null, bd = 1e9;
    for (const e of G.monsters) { if (e.hp <= 0) continue; const d2v = dist2(e.x, e.y, p.x, p.y); if (d2v < bd) { bd = d2v; best = e; } }
    const a = best ? Math.atan2(best.y - p.y, best.x - p.x) : rand(TAU);
    G.flies.push({ x: p.x, y: p.y + 12, ang: a, speed: 820, traveled: 0, phase: 'out',
      len: 150 + g * 22, dmg: [46, 74, 110, 158, 220][g] * dm, trail: [], scale: 1,
      age: 0, backAt: 0.85, bossCd: 0.35 });
    addRing(p.x, p.y + 12, 10, 40, 'rgba(255,150,80,0.85)');
    shake(3, 0.2); tone(320, 0.2, 'sawtooth', 0.1, 100);
  } else if (type === 'web') {

    for (const e of G.monsters) {
      if (e.hp <= 0) continue;
      if (dist2(e.x, e.y, p.x, p.y) < R * R) {
        e.slowT = Math.max(e.slowT || 0, [1.6, 2, 2.4, 2.8, 3.2][g]);
        hurtEnemy(e, [8, 13, 20, 30, 44][g] * dm, rand(TAU), 40, false);
        burst(e.x, e.y, '#e8e0f8', 5, 70); n++;
      }
    }
    addRing(p.x, p.y, 40, R, 'rgba(230,220,250,0.7)');
    tone(240, 0.2, 'sine', 0.06, 60);
  } else if (type === 'ring') {
    const n = [10, 13, 16, 20, 24][g];
    for (let k2 = 0; k2 < n; k2++) {
      G.pbolts.push({ x: p.x, y: p.y, ang: k2 / n * TAU + rand(-0.05, 0.05), speed: 300,
        dmg: [16, 26, 40, 58, 82][g] * dm, t: 0, life: 1.5, r: 5, color: '#8de86a' });
    }
    tone(520, 0.15, 'sawtooth', 0.07, -80);
  } else if (type === 'nova') {
    const R = [180, 215, 255, 300, 350][g];
    addRing(p.x, p.y, 30, R, 'rgba(255,180,80,0.9)');
    shake(4, 0.25);
    for (const e of G.monsters) {
      if (e.hp > 0 && dist2(e.x, e.y, p.x, p.y) < R * R)
        hurtEnemy(e, [40, 62, 92, 130, 180][g] * dm, Math.atan2(e.y - p.y, e.x - p.x), 380, false);
    }
    if (G.boss && G.boss.dying < 0 && dist2(G.boss.x, G.boss.y, p.x, p.y) < R * R)
      bossHurt(G.boss, [40, 62, 92, 130, 180][g] * dm, rand(TAU), 0, false);
    for (let i = 0; i < 24; i++) { const aa = rand(TAU); burst(p.x + Math.cos(aa) * R * 0.8, p.y + Math.sin(aa) * R * 0.8, '#ffb050', 2, 120); }
    tone(140, 0.25, 'sawtooth', 0.12, 80);
  } else if (type === 'thunder') {
    const n = [2, 3, 4, 5, 6][g];
    const tg = G.monsters.filter(e => e.hp > 0 && dist2(e.x, e.y, p.x, p.y) < 620 * 620)
      .sort((a2, b2) => dist2(a2.x, a2.y, p.x, p.y) - dist2(b2.x, b2.y, p.x, p.y)).slice(0, n);
    for (const e of tg) {
      hurtEnemy(e, [30, 45, 66, 92, 125][g] * dm, rand(TAU), 60, false);
      G.strikes.push({ x: e.x, y: e.y, t: 0, jag: [rand(-16, 16), rand(-16, 16), rand(-16, 16), rand(-16, 16)] });
      burst(e.x, e.y, '#cfe8ff', 12, 200);
    }
    if (tg.length) { tone(1100, 0.12, 'square', 0.06, -200); shake(2, 0.15); }
  }
}

function inputVec() {
  let x = 0, y = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
  if (joy) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
    if (d > 8) { const k = Math.min(1, d / 60); x += dx / d * k; y += dy / d * k; }
  } else if (G.mouse) {
    // 角色朝鼠标光标方向移动，靠近光标时停下
    const dx = G.mouse.x - W / 2, dy = G.mouse.y - H / 2, d = Math.hypot(dx, dy);
    if (d > 20) { const k = Math.min(1, (d - 20) / 110); x += dx / d * k; y += dy / d * k; }
  }
  const d = Math.hypot(x, y);
  if (d > 1) { x /= d; y /= d; }
  return [x, y];
}

function doPause() { if (G.state !== 'playing') return; G.state = 'paused'; showScreen('scr-pause'); }
function doResume() { if (G.state !== 'paused') return; G.state = 'playing'; hideScreens(); }
function toMenu() { G.state = 'menu'; showScreen('scr-menu'); buildMenu(); }

const LB_URL = 'https://raw.githubusercontent.com/009-daxiang/yujian-fuyao-data/main/leaderboard.json';
const LB_API = 'https://api.github.com/repos/009-daxiang/yujian-fuyao-data/contents/leaderboard.json';
let LB_LAST = 0;
function playerName() {
  const v = (localStorage.getItem('yujian_name') || '').trim();
  return v || ('侠客' + Math.floor(100 + Math.random() * 900));
}
async function lbFetchAll() {
  try {
    const r = await fetch(LB_URL + '?t=' + Date.now());
    const d = JSON.parse(await r.text());
    return d && d.players ? d : { players: {} };
  } catch (e) { return { players: {} }; }
}
async function lbReport() {
  const now = Date.now();
  if (now - LB_LAST < 15000) return;
  LB_LAST = now;
  try {
    const name = playerName();
    const base = await lbFetchAll();
    const ps = base.players || {};
    const me = ps[name] || {};
    ps[name] = {
      best: Math.max(G.level, me.best || 1),
      kills: Math.max(G.kills, me.kills || 0),
      upd: now,
    };
    // 写云端需要上报密钥（读取对所有人开放）
    const tk = localStorage.getItem('yujian_lb_token');
    if (!tk) return;
    const gr = await fetch(LB_API, { headers: { Accept: 'application/vnd.github+json' } });
    const sha = (await gr.json()).sha;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({ players: ps }))));
    await fetch(LB_API, {
      method: 'PUT',
      headers: {
        Authorization: 'Bearer ' + tk,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ message: 'lb', sha, content }),
    });
  } catch (e) { }
}
const SAVE_KEY = 'yujian_save_player';
function saveGame() {
  if (!G.player) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      level: G.level,
      player: G.player,
      skills: G.skills,
    }));
  } catch (e) { }
}
function hasSave() { return !!localStorage.getItem(SAVE_KEY); }
function clearSave() { localStorage.removeItem(SAVE_KEY); }
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d && d.level && d.player) {
      G.player = Object.assign(newPlayer(), d.player);
      G.skills = d.skills || {};
      startLevel(d.level, true);
      return true;
    }
  } catch (e) { }
  return false;
}
function renderRank(meName) {
  const box = document.getElementById('rank-list');
  box.innerHTML = '加载中……';
  lbFetchAll().then(base => {
    const ps = (base && base.players) || {};
    const arr = Object.entries(ps).map(([n, v]) => ({ n, ...v }));
    arr.sort((a, b) => (b.best - a.best) || (b.kills - a.kills) || ((a.upd || 0) - (b.upd || 0)));
    if (!arr.length) { box.innerHTML = '暂无记录，快来抢占榜首！'; return; }
    box.innerHTML = arr.slice(0, 50).map((r2, i) => {
      const d = new Date(r2.upd || 0);
      const tstr = r2.upd ? (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : '';
      return '<div class="rk' + (r2.n === meName ? ' me' : '') + '"><span class="n">' + (i + 1) + '. ' + r2.n +
        '</span><span>第' + r2.best + '关</span><span>斩' + r2.kills + '</span><span>' + tstr + '</span></div>';
    }).join('');
  });
}

/* ================= 刷怪 ================= */
function spawnPos() {
  const d = Math.max(W, H) * 0.62 + 80;
  for (let i = 0; i < 10; i++) {
    const a = rand(TAU);
    const x = clamp(G.player.x + Math.cos(a) * d, 40, WORLD.w - 40);
    const y = clamp(G.player.y + Math.sin(a) * d, 40, WORLD.h - 40);
    if (dist2(x, y, G.player.x, G.player.y) > 380 * 380) return [x, y];
  }
  const a = rand(TAU);
  return [clamp(G.player.x + Math.cos(a) * d, 40, WORLD.w - 40), clamp(G.player.y + Math.sin(a) * d, 40, WORLD.h - 40)];
}
function spawnMonster(type, px, py, forceElite) {
  const base = MONSTERS[type];
  const lvMul = 1 + (G.level - 1) * 0.16;
  const dmgMul = 1 + (G.level - 1) * 0.08;
  let [x, y] = (px === undefined) ? spawnPos() : [clamp(px, 30, WORLD.w - 30), clamp(py, 30, WORLD.h - 30)];
  const elite = forceElite || (G.level >= 3 && Math.random() < 0.08);
  const e = {
    type, x, y, kx: 0, ky: 0, hitT: 0, flash: 0,
    r: base.r * (elite ? 1.3 : 1) * rand(0.92, 1.08),
    hp: base.hp * lvMul * (elite ? 1.9 : 1),
    maxHp: base.hp * lvMul * (elite ? 1.9 : 1),
    speed: base.speed * (1 + (G.level - 1) * 0.015) * rand(0.9, 1.1),
    dmg: Math.round(base.dmg * dmgMul * (elite ? 1.3 : 1)),
    xp: Math.round(base.xp * (1 + (G.level - 1) * 0.06) * (1 + Math.max(0, G.level - 5) * 0.22) * (elite ? 2 : 1)),
    elite, phase: rand(TAU), dirAng: 0,
    aiT: rand(2), hopT: rand(1), z: 0, born: 0.25,
  };
  G.monsters.push(e);
  return e;
}
function updateSpawns(dt) {
  if (G.clearT >= 0) return;
  const cfg = G.cfg;
  G.spawnT -= dt;
  if (G.spawnT <= 0 && G.monsters.length < cfg.maxAlive) {
    G.spawnT = cfg.interval * rand(0.7, 1.3);
    spawnMonster(pickW(cfg.types));
  }
  G.burstT -= dt;
  if (G.burstT <= 0) {
    G.burstT = rand(14, 20);
    const n = 5 + Math.min(7, G.level);
    const a0 = rand(TAU), d = Math.max(W, H) * 0.62 + 60;
    for (let i = 0; i < n; i++) {
      const a = a0 + i / n * TAU;
      spawnMonster(pickW([['imp', 3], ['fox', 2]]), G.player.x + Math.cos(a) * d, G.player.y + Math.sin(a) * d);
    }
  }
}

function shootProj(x, y, ang, speed, dmg, kind) {
  G.eprojectiles.push({ x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, r: kind === 'web' ? 8 : 7, dmg, kind, t: 0, life: 3.4 });
}

  } else if (kind === 'qiongqi') {

  } else if (kind === 'taowu') {

  } else if (kind === 'taotie') {

  } else {

function updateBoss(dt) {
  const b = G.boss, p = G.player;
  if (!b) return;
  b.orbCd = Math.max(0, (b.orbCd || 0) - dt);
  if (b.dying >= 0) {
    b.dying += dt;
    if (b.dying < 1) {
      if (Math.random() < 0.5) burst(b.x + rand(-50, 50), b.y + rand(-50, 50), b.kind === 'king' ? '#b050e0' : b.kind === 'queen' ? '#8a6ad0' : '#7fb069', 6);
      if (b.kind === 'centipede' && b.segs.length) { const s = b.segs.pop(); burst(s.x, s.y, '#7fb069', 10); }
    } else if (!b.dead) {
      b.dead = true;
      if (b.kind === 'king' || b.kind === 'ninehead' || b.kind === 'queen') { burst(b.x, b.y, b.kind === 'king' ? '#c060ff' : b.kind === 'queen' ? '#a878e8' : '#a0d060', 60); shake(14, 0.8); }
      // BOSS 掉落技能卷轴：随机一系，品阶随章节 B/A/S/SS/SSS
      const poolKeys = Object.keys(SKILL_POOL);
      const stype = poolKeys[Math.floor(rand(poolKeys.length))];
      const gdrop = G.level >= 501 ? 4 : Math.floor((G.level - 1) / 5) % 4;
      G.pickups.push({ x: b.x, y: b.y, kind: 'scroll', grade: gdrop, stype, t: 0 });
      addFloat(b.x, b.y - b.r - 34, '「' + SKILL_POOL[stype].name + '」卷轴掉落！', GRADE_META[gdrop].c, 18);
      checkClear();
    }
    return;
  }
  b.t += dt; b.flash = Math.max(0, b.flash - dt);
  // 狂暴：血量 30% 以下提速强化（拉扯走位）
  if (!b.enraged && b.hp < b.maxHp * 0.3 && b.dying < 0) {
    b.enraged = true;
    b.speed *= 1.38;
    if (b.chaseEvery) b.chaseEvery *= 0.55;
    if (b.webT !== undefined) b.webT = Math.min(b.webT, 0.8);
    if (b.ringT !== undefined) b.ringT = Math.min(b.ringT, 0.6);
    if (b.spikeT !== undefined) b.spikeT = Math.min(b.spikeT, 0.4);
    if (b.turn) b.turn *= 1.5;
    addFloat(b.x, b.y - b.r - 26, '狂暴！', '#ff5050', 24);
    burst(b.x, b.y, '#ff5050', 30, 260);
    shake(6, 0.4); sfx.boss();
  }
  const angTo = Math.atan2(p.y - b.y, p.x - b.x);
  if (b.kind === 'centipede') {
    let da = angTo - b.ang;
    while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    b.ang += clamp(da, -b.turn * dt, b.turn * dt);
    b.x += Math.cos(b.ang) * b.speed * dt;
    b.y += Math.sin(b.ang) * b.speed * dt;
    let prev = b;
    for (const s of b.segs) {
      const px = prev === b ? b.x : prev.x, py = prev === b ? b.y : prev.y;
      const d = Math.hypot(s.x - px, s.y - py);
      if (d > 24) { s.x = px + (s.x - px) / d * 24; s.y = py + (s.y - py) / d * 24; }
      prev = s;
    }
    // 头部与体节接触判定
    contactPlayer(b.x, b.y, b.r, Math.round(16 * (1 + (G.level - 1) * 0.06)));
    for (const s of b.segs) contactPlayer(s.x, s.y, 16, 12);
  } else if (b.kind === 'queen') {
    b.aim = angTo;
    b.x += Math.cos(angTo) * b.speed * dt;
    b.y += Math.sin(angTo) * b.speed * dt;
    contactPlayer(b.x, b.y, b.r, Math.round(20 * (1 + (G.level - 1) * 0.05)));
    b.webT -= dt;
    if (b.webT <= 0) {
      b.webT = 2.2;
      const wc = b.webCount || 1;
      for (let i = 0; i < wc; i++)
        shootProj(b.x, b.y, angTo + (i - (wc - 1) / 2) * 0.18, 235, 0, 'web');
      tone(300, 0.15, 'sine', 0.07, -90);
    }
    b.summonT -= dt;
    if (b.summonT <= 0 && G.monsters.length < G.cfg.maxAlive + 8) {
      b.summonT = 6.5;
      for (let i = 0; i < (b.summonCount || 2); i++) {
        const aa = rand(TAU);
        const m = spawnMonster('spider', b.x + Math.cos(aa) * 80, b.y + Math.sin(aa) * 80);
        burst(m.x, m.y, '#8a6ad0', 8);
      }
    }
  } else if (b.kind === 'zhulong') {
    // 烛龙：凝视锁敌后吐出天烛光焰
    if (b.state === 'chase' || !b.state) {
      b.state = 'chase';
      b.x += Math.cos(angTo) * b.speed * dt;
      b.y += Math.sin(angTo) * b.speed * dt;
      b.aim = angTo;
      contactPlayer(b.x, b.y, b.r, b.chaseDmg);
      if (b.t > 2.2) { b.state = 'beamTel'; b.t = 0; }
    } else if (b.state === 'beamTel') {
      if (b.t < 0.5) b.aim = angTo;
      if (b.t > 0.9) { b.state = 'beam'; b.t = 0; b.beamTick = 0; tone(160, 0.4, 'sawtooth', 0.16, 40); }
    } else if (b.state === 'beam') {
      b.beamTick -= dt;
      const dx = p.x - b.x, dy = p.y - b.y;
      const along = dx * Math.cos(b.aim) + dy * Math.sin(b.aim);
      const perp = Math.abs(-dx * Math.sin(b.aim) + dy * Math.cos(b.aim));
      if (along > 0 && along < 700 && perp < 46 && b.beamTick <= 0) {
        b.beamTick = 0.15;
        hurtPlayer(b.beamDmg);
      }
      if (Math.random() < 0.6) burst(b.x + Math.cos(b.aim) * rand(80, 660), b.y + Math.sin(b.aim) * rand(80, 660), '#ff7a3c', 2, 120);
      if (b.t > 0.7) { b.state = 'chase'; b.t = 0; }
    }
  } else if (b.kind === 'qiongqi') {
    // 穷奇：游猎 + 双螺旋弹幕
    const s = Math.sin(G.t * 2.4 + (b.phase || 0)) * 70;
    b.x += (Math.cos(angTo) * b.speed + Math.cos(angTo + Math.PI / 2) * s) * dt;
    b.y += (Math.sin(angTo) * b.speed + Math.sin(angTo + Math.PI / 2) * s) * dt;
    b.aim = angTo;
    contactPlayer(b.x, b.y, b.r, b.chaseDmg);
    b.spiralT -= dt;
    if (b.spiralT <= 0) {
      b.spiralT = 2.2;
      b.spiralA += 0.35;
      for (let k2 = 0; k2 < 12; k2++) shootProj(b.x, b.y, b.spiralA + k2 / 12 * TAU, 175, b.ringDmg, 'venom');
      tone(300, 0.15, 'square', 0.08, -60);
    }
  } else if (b.kind === 'taowu') {
    // 梼杌：狂乱追击 + 落狱地刺
    b.x += Math.cos(angTo) * b.speed * dt;
    b.y += Math.sin(angTo) * b.speed * dt;
    b.aim = angTo;
    contactPlayer(b.x, b.y, b.r, b.chaseDmg);
    b.spikeT -= dt;
    if (b.spikeT <= 0) {
      b.spikeT = 3.2;
      for (let k2 = 0; k2 < 5; k2++) {
        const zx = k2 === 0 ? p.x : p.x + Math.cos(rand(TAU)) * rand(30, 150);
        const zy = k2 === 0 ? p.y : p.y + Math.sin(rand(TAU)) * rand(30, 150);
        G.zones.push({ x: clamp(zx, 20, WORLD.w - 20), y: clamp(zy, 20, WORLD.h - 20), r: 62, t: 0, delay: 0.75, dmg: b.spikeDmg });
      }
      tone(180, 0.2, 'square', 0.1, -40);
    }
  } else if (b.kind === 'taotie') {
    // 饕餮：吞噬引力拉扯主角 + 吞妖回血
    if (b.state === 'chase' || !b.state) {
      b.state = 'chase';
      b.x += Math.cos(angTo) * b.speed * dt;
      b.y += Math.sin(angTo) * b.speed * dt;
      b.aim = angTo;
      contactPlayer(b.x, b.y, b.r, b.chaseDmg);
      b.vacT = (b.vacT === undefined ? 3 : b.vacT) - dt;
      if (b.vacT <= 0) { b.state = 'vacuum'; b.t = 0; }
      b.devT = (b.devT === undefined ? 2 : b.devT) - dt;
      if (b.devT <= 0) {
        b.devT = 3;
        for (let k2 = G.monsters.length - 1; k2 >= 0; k2--) {
          const e = G.monsters[k2];
          if (e.hp > 0 && dist2(e.x, e.y, b.x, b.y) < 70 * 70) {
            G.monsters.splice(k2, 1);
            b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.01);
            burst(b.x, b.y, '#ffd050', 8);
            break;
          }
        }
      }
    } else if (b.state === 'vacuum') {
      const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy) || 1;
      p.x += dx / d * 250 * dt; p.y += dy / d * 250 * dt;
      if (Math.random() < 0.4) burst(p.x + rand(-20, 20), p.y + rand(-20, 20), '#a050ff', 1, 40);
      if (b.t > 1.1) {
        b.state = 'chase'; b.t = 0; b.vacT = 4;
        if (d < 150) hurtPlayer(b.biteDmg);
        burst(b.x, b.y, '#ffd050', 24, 260);
        shake(6, 0.3); sfx.slam();
      }
    }
  } else { // king & ninehead 共用冲撞状态机
    b.summonT -= dt;
    if (b.summonT <= 0 && G.monsters.length < G.cfg.maxAlive + 8) {
      b.summonT = b.summonEvery;
      for (let i = 0; i < b.summonCount; i++) {
        const aa = rand(TAU);
        const m = spawnMonster(b.summonType, b.x + Math.cos(aa) * 70, b.y + Math.sin(aa) * 70);
        burst(m.x, m.y, b.kind === 'ninehead' ? '#6a8f3c' : '#8a2be2', 10);
      }
    }
    if (b.state === 'chase') {
      b.x += Math.cos(angTo) * b.speed * dt;
      b.y += Math.sin(angTo) * b.speed * dt;
      b.aim = angTo;
      contactPlayer(b.x, b.y, b.r, b.chaseDmg);
      if (b.kind === 'ninehead') {
        b.ringT -= dt;
        if (b.ringT <= 0) {
          b.ringT = 2.4;
          const n = b.ringCount || 8, a0 = rand(TAU);
          for (let i = 0; i < n; i++) shootProj(b.x, b.y, a0 + i / n * TAU, b.ringSpeed || 190, b.ringDmg, 'venom');
          tone(220, 0.2, 'sawtooth', 0.1, -60);
        }
      }
      if (b.t > (b.chaseEvery || 2.6)) {
        b.t = 0;
        const d = Math.hypot(p.x - b.x, p.y - b.y);
        b.state = d < (b.slamR || 170) ? 'slamTel' : 'chargeTel';
      }
    } else if (b.state === 'chargeTel') {
      if (b.t < 0.45) b.aim = angTo;
      if (b.t > 0.75) { b.state = 'charge'; b.t = 0; b.cx = b.x; b.cy = b.y; sfx.slam(); }
    } else if (b.state === 'charge') {
      b.x += Math.cos(b.aim) * b.chargeSpeed * dt;
      b.y += Math.sin(b.aim) * b.chargeSpeed * dt;
      contactPlayer(b.x, b.y, b.r + 8, b.chargeDmg);
      burst(b.x, b.y, b.kind === 'ninehead' ? '#7fb069' : '#b050e0', 2);
      const moved = Math.hypot(b.x - b.cx, b.y - b.cy);
      if (b.t > 0.55 || moved > 520) { b.state = 'recover'; b.t = 0; shake(8, 0.3); }
    } else if (b.state === 'slamTel') {
      if (b.t > 0.55) {
        b.state = 'recover'; b.t = 0;
        shake(12, 0.5); sfx.slam();
        for (let i = 0; i < 26; i++) { const a = rand(TAU); burst(b.x + Math.cos(a) * 100, b.y + Math.sin(a) * 100, '#ff5050', 3); }
        if (dist2(p.x, p.y, b.x, b.y) < (b.slamR || 170) * (b.slamR || 170)) hurtPlayer(Math.round((b.slamDmg || 34) * (1 + (G.level - 10) * 0.02)));
      }
    } else if (b.state === 'recover') {
      if (b.t > 0.7) { b.state = 'chase'; b.t = 0; }
    }
  }
}

/* ================= 伤害与击杀 ================= */
function contactPlayer(x, y, r, dmg) {
  const p = G.player;
  if (dist2(x, y, p.x, p.y) < (r + 14) * (r + 14)) hurtPlayer(dmg);
}
function hurtPlayer(dmg) {
  const p = G.player;
  if (p.invuln > 0 || G.state !== 'playing') return;
  p.hp -= dmg; p.invuln = 0.8;
  shake(7, 0.35); sfx.hurt();
  addFloat(p.x, p.y - 30, '-' + dmg, '#ff6a6a', 17);
  burst(p.x, p.y, '#e5484d', 8);
  if (p.hp <= 0) {
    p.hp = 0;
    G.state = 'over';
    $('over-stats').innerHTML = '第 <b>' + G.level + '</b> 关 · 斩妖 <b>' + G.kills + '</b> · 历时 <b>' + fmtTime(G.time) + '</b>';
    showScreen('scr-over');
    lbReport();
  }
}
function hurtEnemy(e, dmg, ang, knock, canCrit) {
  if (e.hp <= 0) return;
  let crit = false;
  if (canCrit && Math.random() < G.player.crit) { dmg *= 2.2; crit = true; }
  dmg = Math.round(dmg);
  e.hp -= dmg; e.flash = 0.09;
  e.kx += Math.cos(ang) * knock; e.ky += Math.sin(ang) * knock;
  addFloat(e.x + rand(-8, 8), e.y - e.r - 8, dmg, crit ? '#ffb020' : '#f0ead8', crit ? 22 : 14);
  addSlash(e.x, e.y, ang, e.r + 12);
  burst(e.x, e.y, crit ? '#ffb020' : '#cfe8ff', crit ? 6 : 3, 150);
  G.hitStop = Math.max(G.hitStop, crit ? 0.035 : 0.012);
  sfx.hit();
  if (e.hp <= 0) killEnemy(e);
  else if (e.isBossRef) e.isBossRef.flash = 0.09;
}
function killEnemy(e) {
  G.kills++; G.killsThisLevel++;
  burst(e.x, e.y, MONSTERS[e.type].color, e.elite ? 22 : 12, 200);
  addRing(e.x, e.y, e.r * 0.5, e.r * (e.elite ? 3 : 2.2), e.elite ? 'rgba(255,216,96,0.9)' : 'rgba(200,235,255,0.8)');
  shake(e.elite ? 5 : 2, e.elite ? 0.25 : 0.12);
  G.hitStop = Math.max(G.hitStop, e.elite ? 0.06 : 0.03);
  tone(240 + rand(80), 0.09, 'square', 0.09, -140);
  sfx.kill();
  dropOrbs(e.x, e.y, Math.max(1, Math.round(e.xp * rand(0.85, 1.2))));
  if (Math.random() < 0.04) G.pickups.push({ x: e.x, y: e.y, kind: 'gourd', t: 0 });
}
function dropOrbs(x, y, total) {
  const n = total >= 12 ? 3 : total >= 6 ? 2 : 1;
  for (let i = 0; i < n; i++) {
    if (G.orbs.length > 220) { G.orbs[Math.floor(rand(G.orbs.length))].val += Math.ceil(total / n); continue; }
    G.orbs.push({
      x, y, vx: rand(-70, 70), vy: rand(-70, 70),
      val: Math.ceil(total / n), t: rand(TAU),
    });
  }
}
function checkClear() {
  const cfg = G.cfg;

function showClear() {

/* ================= 升级 ================= */
function gainXP(v) {
  const p = G.player;
  p.xp += Math.round(v * p.xpMul);
  while (p.xp >= p.xpNext) {
    p.xp -= p.xpNext;
    p.xpLv++;
    p.xpNext = Math.round(22 * Math.pow(1.18, p.xpLv - 1));
    // 境界突破播报
    const tier = playerTier(p);
    if (tier > (p.tierShown || 1)) {
      p.tierShown = tier;
      const msg = ['', '剑心渐明！', '背负灵剑！', '御剑凌空！', '剑仙降世！'][tier];
      addFloat(p.x, p.y - 46, msg, '#ffe08a', 21);
      burst(p.x, p.y, '#ffe08a', 30, 220);
      addRing(p.x, p.y, 20, 90, 'rgba(255,224,130,0.95)');
      tone(660, 0.3, 'triangle', 0.12, 220);
      G.hitStop = Math.max(G.hitStop, 0.12);
    }
    saveGame();
    openLevelUp();
  }
}
function openLevelUp() {
  const p = G.player;
  const pool = UPGRADES.filter(u => (p.upCounts[u.id] || 0) < u.max && (!u.ok || u.ok(p)));
  const offers = [];
  while (offers.length < 3 && pool.length) {
    const u = pool.splice(Math.floor(rand(pool.length)), 1)[0];
    offers.push(u);
  }
  while (offers.length < 3) offers.push(HEAL_CARD);
  G.state = 'levelup';
  sfx.levelup();
  const box = $('cards'); box.innerHTML = '';
  offers.forEach((u, i) => {
    const c = document.createElement('div');
    c.className = 'card';
    const icf = ICON_FILES[u.id];
    c.innerHTML = '<div class="ic">' + (icf ? '<img src="assets/icons/' + icf + '.svg" alt="">' : u.icon) + '</div><div class="tx"><div class="nm">' + u.name + '</div><div class="ds">' + u.desc + '</div></div>';
    c.onclick = () => pickCard(i);
    box.appendChild(c);
  });
  G.offers = offers;
  showScreen('scr-levelup');
}
function pickCard(i) {
  if (G.state !== 'levelup') return;
  const u = G.offers[i];
  if (!u) return;
  u.apply(G.player);
  if (u.id !== 'heal') G.player.upCounts[u.id] = (G.player.upCounts[u.id] || 0) + 1;
  const a2 = ac();
  if (a2) { const t0 = a2.currentTime; playSample('harp', 'C4', t0, 1, 0.18); playSample('harp', 'E4', t0 + 0.09, 1, 0.15); playSample('harp', 'A4', t0 + 0.18, 1, 0.15); }
  sfx.click();
  saveGame();
  hideScreens();
  G.state = 'playing';
  burst(G.player.x, G.player.y, '#ffe08a', 24);
  // 经验溢出可能连续升级
  if (G.player.xp >= G.player.xpNext) gainXP(0);
}

/* ================= 特效 ================= */

function addFloat(x, y, txt, color, size) {

}
function addSlash(x, y, ang, r) {

const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

/* ================= 主更新 ================= */
function update(dt) {
  const p = G.player;
  G.t += dt; G.time += dt;
  G.introT = Math.max(0, G.introT - dt);
  G.shakeT = Math.max(0, G.shakeT - dt);
  if (G.shakeT <= 0) G.shakeMag = 0;
  p.invuln = Math.max(0, p.invuln - dt);
  p.slowT = Math.max(0, (p.slowT || 0) - dt);
  if (G.petMsg > 0) G.petMsg -= dt;
  if (G.stageMsg > 0) G.stageMsg -= dt;
  p.footFlash = Math.max(0, (p.footFlash || 0) - dt);

  // 移动
  const [mx, my] = inputVec();
  const spd = p.speed * (p.slowT > 0 ? 0.55 : 1);
  p.x = clamp(p.x + mx * spd * dt, 18, WORLD.w - 18);
  p.y = clamp(p.y + my * spd * dt, 18, WORLD.h - 18);
  if (mx !== 0) p.faceX = mx > 0 ? 1 : -1;
  // 朝向平滑 + 剑环甩向前方
  if (mx || my) {
    const dl = Math.hypot(mx, my) || 1;
    p.dirX += (mx / dl - p.dirX) * Math.min(1, 9 * dt);
    p.dirY += (my / dl - p.dirY) * Math.min(1, 9 * dt);
  }
  p.ringOff = lerp(p.ringOff || 0, (mx || my) ? 1 : 0, Math.min(1, 7 * dt));

  // 环绕飞剑
  const orb = p.orbit;
  orb.ang += orb.rot * dt;
  const mobS = IS_MOBILE ? 0.67 : 1, mobR = IS_MOBILE ? 0.78 : 1;
  const slen = orb.len * p.sizeMul * 0.67 * mobS;
  const orbR = orb.radius * mobR;
  for (let i = 0; i < orb.count; i++) {
    const a = orb.ang + i / orb.count * TAU;
    const ocx = p.x + p.dirX * 26 * (p.ringOff || 0), ocy = p.y + p.dirY * 26 * (p.ringOff || 0);
    const mobR2 = IS_MOBILE ? 0.47 : 1;
    const sx = ocx + Math.cos(a) * orb.radius * mobR2, sy = ocy + Math.sin(a) * orb.radius * mobR2;
    const bang = a + Math.PI / 2;
    const hx = sx + Math.cos(bang) * slen * 0.25, hy = sy + Math.sin(bang) * slen * 0.25;
    const hr = slen * 0.24;
    for (const e of G.monsters) {
      if (e.hp <= 0 || e.orbCd > 0) continue;
      if (dist2(hx, hy, e.x, e.y) < (hr + e.r) * (hr + e.r)) {
        e.orbCd = 0.35;
        hurtEnemy(e, orb.dmg * p.dmgMul, bang, 170, true);
      }
    }
    if (G.boss && G.boss.dying < 0 && (G.boss.orbCd || 0) <= 0) {
      const b = G.boss;
      const pts = b.kind === 'centipede' ? [b, ...b.segs] : [b];
      for (const pt of pts) {
        if (dist2(hx, hy, pt.x, pt.y) < (hr + (pt === b ? b.r : 16)) * (hr + (pt === b ? b.r : 16))) {
          b.orbCd = 0.35;
          bossHurt(b, orb.dmg * p.dmgMul, bang, 30, true);
          break;
        }
      }
    }
  }

  // 飞剑出击：冷却结束后进入激发队列，从脚下御剑中一把挨着一把射出
  const fly = p.fly;
  fly.t -= dt;
  if (fly.t <= 0 && G.state === 'playing') {
    fly.t = fly.cd;
    p.launchQueue = Math.min(8, 2 + Math.floor((orb.count - 2) / 2) + (p.flyExtra || 0));
    p.launchT = 0;
    p.launchIdx = 0;
  }
  if ((p.launchQueue || 0) > 0) {
    p.launchT -= dt;
    if (p.launchT <= 0) {
      p.launchT = 0.14;
      const idx = p.launchIdx++;
      p.launchQueue--;
      const alive = G.monsters.filter(e => e.hp > 0)
        .sort((a, b2) => dist2(a.x, a.y, p.x, p.y) - dist2(b2.x, b2.y, p.x, p.y));
      const tgt = alive[idx % Math.max(1, alive.length)];
      const spread = (idx % 2 === 0 ? 1 : -1) * Math.ceil(idx / 2) * 0.07;
      const ang = (tgt ? Math.atan2(tgt.y - p.y, tgt.x - p.x) : rand(TAU)) + spread;
      G.flies.push({
        x: p.x, y: p.y + 15, ang, speed: fly.speed, traveled: 0, phase: 'out',
        len: fly.len * p.sizeMul * (IS_MOBILE ? 0.54 : 0.67), dmg: fly.dmg * p.dmgMul, trail: [], scale: 0.3,
        idx, age: 0, backAt: 0.9 + idx * 0.15,
      });
      p.footFlash = 0.12;
      addRing(p.x, p.y + 15, 8, 30, 'rgba(160,220,255,0.7)');
      tone(520, 0.05, 'triangle', 0.04, 180);
    }
  }

  // 飞剑更新
  for (let i = G.flies.length - 1; i >= 0; i--) {
    const f = G.flies[i];
    f.bossCd = Math.max(0, (f.bossCd || 0) - dt);
    if (f.phase === 'out') {
      // 出鞘：飞剑逐渐变大
      f.scale = Math.min(1, (f.scale || 1) + 4.5 * dt);
      f.age = (f.age || 0) + dt;
      if (f.life !== undefined) { f.life -= dt; if (f.life <= 0) { G.flies.splice(i, 1); continue; } }
      // 追踪：回风剑诀 / 分裂剑意（自动追踪）
      const hLv = Math.max(p.flyHoming || 0, p.splitGrade >= 0 ? (f.child ? 2 : 1) : 0);
      let tracking = false;
      if (hLv) {
        const hR = 340 + Math.max(0, hLv - 3) * 200; // 3 级后追踪范围每级 +200
        let best = null, bd = hR * hR;
        for (const e of G.monsters) { if (e.hp <= 0) continue; const d2v = dist2(f.x, f.y, e.x, e.y); if (d2v < bd) { bd = d2v; best = e; } }
        if (G.boss && G.boss.dying < 0) { const d2v = dist2(f.x, f.y, G.boss.x, G.boss.y); if (d2v < bd) { bd = d2v; best = G.boss; } }
        if (best) {
          tracking = true; // 有目标锁定：不受折返限制，追到命中为止
          const ta = Math.atan2(best.y - f.y, best.x - f.x);
          let da = ta - f.ang;
          while (da > Math.PI) da -= TAU;
          while (da < -Math.PI) da += TAU;
          const tv = (2.2 + hLv * 1.2) * (f.child ? 1.4 : 1);
          f.ang += clamp(da * 0.12, -tv * dt, tv * dt); // 比例导引：按剩余角差转向，消除绕圈
        }
      }
      f.x += Math.cos(f.ang) * f.speed * dt;
      f.y += Math.sin(f.ang) * f.speed * dt;
      f.traveled += f.speed * dt;
      if (!tracking && (f.age >= (f.backAt || 0.9) || f.traveled > 560)) f.phase = 'back';
      if (f.age > 8) f.phase = 'back'; // 保险丝：追踪不超过 8 秒
    } else {
      // 收剑归脚底：剑柄朝前，逐渐缩小，吸收时光芒一闪
      const ma = Math.atan2((p.y + 12) - f.y, p.x - f.x);
      f.ang = ma + Math.PI;
      f.scale = Math.max(0.22, (f.scale || 1) - 2.6 * dt);
      const sp = f.speed * 1.2;
      f.x += Math.cos(ma) * sp * dt; f.y += Math.sin(ma) * sp * dt;
      if (dist2(f.x, f.y, p.x, p.y + 12) < 20 * 20) {
        G.flies.splice(i, 1);
        p.footFlash = 0.18;
        burst(p.x, p.y + 14, '#9fd8ff', 3, 70);
        continue;
      }
    }
    f.trail.unshift({ x: f.x, y: f.y });
    if (f.trail.length > 12) f.trail.pop();
    const elc = { fire: '#ff9a4c', ice: '#bdeaff', crit: '#ff6a6a', wind: '#7de8b8', violet: '#c9a8ff', steel: '#bfe4ff' }[swordElement(p)];
    if (Math.random() < 0.3) G.parts.push({ x: f.x, y: f.y, vx: rand(-30, 30), vy: rand(-30, 30), r: rand(1, 2.4), color: elc, life: 0.3, t: 0 });
    for (const e of G.monsters) {
      if (e.hp <= 0 || e.flyCd > 0) continue;
      if (dist2(f.x, f.y, e.x, e.y) < (f.len * 0.22 + e.r) * (f.len * 0.22 + e.r)) {
        e.flyCd = 0.26;
        hurtEnemy(e, f.dmg, f.ang, 240, true);
        // 分裂剑意：刺中后分裂（品阶越高分裂越多）
        if (p.splitGrade >= 0 && !f.child && !f.splitDone && G.flies.length < 46) {
          const n = 2 + p.splitGrade + Math.min(2, p.splitBonus || 0);
          for (let k2 = 0; k2 < n; k2++) {
            const sa = f.ang + (k2 - (n - 1) / 2) * 0.55 + rand(-0.08, 0.08);
            G.flies.push({ x: f.x, y: f.y, ang: sa, speed: f.speed * 0.85, traveled: 0, phase: 'out',
              len: f.len * 0.6, dmg: f.dmg * 0.6, trail: [], scale: 0.4,
              child: true, age: 0, backAt: 99, life: 1.1, bossCd: 0.3 });
          }
          f.splitDone = true;
          addRing(f.x, f.y, 6, 24, 'rgba(255,215,130,0.85)');
          tone(680, 0.05, 'triangle', 0.05, 220);
        }
      }
    }
    if (G.boss && G.boss.dying < 0 && (f.bossCd || 0) <= 0) {
      const b = G.boss;
      const pts = b.kind === 'centipede' ? [b, ...b.segs] : [b];
      for (const pt of pts) {
        const pr = pt === b ? b.r : 16;
        if (dist2(f.x, f.y, pt.x, pt.y) < (f.len * 0.22 + pr) * (f.len * 0.22 + pr)) {
          bossHurt(b, f.dmg, f.ang, 40, true);
          f.bossCd = 0.3;
          break;
        }
      }
    }
  }

  // 剑罡领域
  if (p.aura) {
    p.aura.t -= dt;
    if (p.aura.t <= 0) {
      p.aura.t = 0.4;
      const dps = p.aura.dps * p.dmgMul * 0.4;
      for (const e of G.monsters) {
        if (e.hp > 0 && dist2(e.x, e.y, p.x, p.y) < (p.aura.r + e.r) * (p.aura.r + e.r))
          hurtEnemy(e, dps, Math.atan2(e.y - p.y, e.x - p.x), 60, false);
      }
      if (G.boss && G.boss.dying < 0 && dist2(G.boss.x, G.boss.y, p.x, p.y) < (p.aura.r + G.boss.r) * (p.aura.r + G.boss.r))
        bossHurt(G.boss, dps, rand(TAU), 0, false);
    }
  }

  // 小怪更新
  for (let i = G.monsters.length - 1; i >= 0; i--) {
    const e = G.monsters[i];
    if (e.hp <= 0) { G.monsters.splice(i, 1); continue; }
    e.flash = Math.max(0, e.flash - dt);
    e.hitT = Math.max(0, (e.hitT || 0) - dt);
    e.orbCd = Math.max(0, (e.orbCd || 0) - dt);
    e.flyCd = Math.max(0, (e.flyCd || 0) - dt);
    e.born = Math.max(0, e.born - dt);
    e.phase += dt * 6;
    const ang = Math.atan2(p.y - e.y, p.x - e.x);
    e.dirAng = ang;
    let vx = 0, vy = 0;
    const perp = ang + Math.PI / 2;
    switch (e.type) {
      case 'bat': {
        const s = Math.sin(G.t * 5 + e.phase) * 95;
        vx = Math.cos(ang) * e.speed + Math.cos(perp) * s;
        vy = Math.sin(ang) * e.speed + Math.sin(perp) * s;
        break;
      }
      case 'snake': {
        const s = Math.sin(G.t * 3.2 + e.phase) * 55;
        vx = Math.cos(ang) * e.speed + Math.cos(perp) * s;
        vy = Math.sin(ang) * e.speed + Math.sin(perp) * s;
        break;
      }
      case 'fox': {
        const s = Math.sin(G.t * 2.5 + e.phase) * 32;
        vx = Math.cos(ang) * e.speed + Math.cos(perp) * s;
        vy = Math.sin(ang) * e.speed + Math.sin(perp) * s;
        break;
      }
      case 'spider': {
        const c = e.aiT % 2.1;
        e.aiT += dt;
        let mul = 0.55;
        if (c >= 1.2 && c < 1.5) mul = 0;
        else if (c >= 1.5) mul = 2.8;
        vx = Math.cos(ang) * e.speed * mul; vy = Math.sin(ang) * e.speed * mul;
        break;
      }
      case 'toad': {
        e.hopT += dt;
        const cyc = e.hopT % 1.05;
        e.z = 0;
        if (cyc < 0.35) { e.z = Math.sin(cyc / 0.35 * Math.PI) * 24; vx = Math.cos(ang) * e.speed * 3.1; vy = Math.sin(ang) * e.speed * 3.1; }
        break;
      }
      case 'rat': {
        const s = Math.sin(G.t * 8 + e.phase) * 28;
        vx = Math.cos(ang) * e.speed + Math.cos(perp) * s;
        vy = Math.sin(ang) * e.speed + Math.sin(perp) * s;
        break;
      }
      case 'scorpion': {
        const c = e.aiT % 2.4;
        e.aiT += dt;
        let mul = 0.5;
        if (c >= 1.1 && c < 1.8) mul = 0; // 蓄力
        else if (c >= 1.8) mul = 3.2;     // 突刺
        vx = Math.cos(ang) * e.speed * mul; vy = Math.sin(ang) * e.speed * mul;
        break;
      }
      case 'flower': {
        const dx = p.x - e.x, dy = p.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        let sp = 0;
        if (d > 300) sp = e.speed;
        else if (d < 210) sp = -e.speed * 0.7;
        const strafe = Math.sin(G.t * 1.5 + e.phase) * 40;
        vx = dx / d * sp + Math.cos(perp) * strafe;
        vy = dy / d * sp + Math.sin(perp) * strafe;
        e.aiT += dt;
        if (e.aiT > 2.6 && d < 540) {
          e.aiT = 0;
          shootProj(e.x, e.y, Math.atan2(dy, dx), 210, Math.round(12 * (1 + (G.level - 1) * 0.06)), 'pollen');
          tone(340, 0.08, 'sine', 0.05, -60);
        }
        break;
      }
      case 'wolf': {
        // 狼妖：压低身子蓄力后扑咬
        const c = e.aiT % 1.8;
        e.aiT += dt;
        let mul = 0.75;
        if (c >= 1.1 && c < 1.4) mul = 0.05;  // 俯身蓄势
        else if (c >= 1.4) mul = 3.4;         // 猛扑
        vx = Math.cos(ang) * e.speed * mul; vy = Math.sin(ang) * e.speed * mul;
        break;
      }
      case 'lantern': {
        // 灯妖：飘行并吐鬼火
        vx = Math.cos(ang) * e.speed; vy = Math.sin(ang) * e.speed;
        e.aiT += dt;
        if (e.aiT > 3.0) {
          e.aiT = 0;
          shootProj(e.x, e.y, ang + rand(-0.15, 0.15), 165, Math.round(13 * (1 + (G.level - 1) * 0.06)), 'fire');
          tone(280, 0.12, 'sawtooth', 0.06, -80);
        }
        break;
      }
      case 'jiao': {
        // 蛟妖：游走蓄势后直线蛟冲
        const c = e.aiT % 4.2;
        e.aiT += dt;
        let mul = 1;
        if (c >= 3.2 && c < 3.7) mul = 0.12;
        else if (c >= 3.7) mul = 3.6;
        const weave = mul === 1 ? Math.sin(G.t * 2.5 + e.phase) * 60 : 0;
        vx = Math.cos(ang) * e.speed * mul + Math.cos(perp) * weave;
        vy = Math.sin(ang) * e.speed * mul + Math.sin(perp) * weave;
        break;
      }
      default:
        vx = Math.cos(ang) * e.speed; vy = Math.sin(ang) * e.speed;
    }
    if (e.slowT > 0) { vx *= 0.45; vy *= 0.45; }
    e.x += vx * dt + e.kx * dt;
    e.y += vy * dt + e.ky * dt;
    e.x = clamp(e.x, 12, WORLD.w - 12);
    e.y = clamp(e.y, 12, WORLD.h - 12);
    e.kx *= Math.exp(-8 * dt); e.ky *= Math.exp(-8 * dt);
    if (e.born <= 0) contactPlayer(e.x, e.y, e.r, e.dmg);
  }

  // 妖弹 / 蛛丝
  for (let i = G.eprojectiles.length - 1; i >= 0; i--) {
    const q = G.eprojectiles[i];
    q.t += dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.t > q.life) { G.eprojectiles.splice(i, 1); continue; }
    if (dist2(q.x, q.y, p.x, p.y) < (q.r + 12) * (q.r + 12)) {
      G.eprojectiles.splice(i, 1);
      if (q.kind === 'web') {
        p.slowT = 2.2;
        addFloat(p.x, p.y - 34, '被缠住了！', '#e8e0f8', 14);
        hurtPlayer(Math.round(6 * (1 + (G.level - 1) * 0.06)));
      } else hurtPlayer(q.dmg);
    }
  }

  // 灵宠：跟随、射灵弹、技能「灵狐护主」；150/300 关进化
  if (G.pet) {
    const q = G.pet;
    q.t += dt;
    const stage = G.level >= 300 ? 3 : G.level >= 150 ? 2 : 1;
    if ((q.stage || 1) < stage) {
      q.stage = stage;
      addFloat(p.x, p.y - 50, stage === 3 ? '进化：九尾天狐！' : '进化：三尾灵狐！', '#7fe0ff', 21);
      burst(q.x, q.y, '#7fe0ff', 30, 240);
      addRing(q.x, q.y, 16, 80, 'rgba(127,224,255,0.95)');
      tone(760, 0.3, 'triangle', 0.12, 260);
      G.hitStop = Math.max(G.hitStop, 0.1);
    }
    if (G.level >= 501) q.golden = true; // 天外天金身加持
    const tx = p.x - 44, ty = p.y - 36 + Math.sin(q.t * 2.2) * 6;
    q.x += (tx - q.x) * Math.min(1, 5 * dt);
    q.y += (ty - q.y) * Math.min(1, 5 * dt);
    const boltDmg = 7 * p.dmgMul * (1 + (G.level - 1) * 0.05) * (q.golden ? 1.5 : 1);
    q.shootT -= dt;
    if (q.shootT <= 0) {
      q.shootT = stage >= 3 ? 0.42 : stage === 2 ? 0.55 : 0.75;
      let best = null, bd = 460 * 460;
      for (const e of G.monsters) { if (e.hp <= 0) continue; const d2v = dist2(q.x, q.y, e.x, e.y); if (d2v < bd) { bd = d2v; best = e; } }
      if (G.boss && G.boss.dying < 0) { const d2v = dist2(q.x, q.y, G.boss.x, G.boss.y); if (d2v < bd) { bd = d2v; best = G.boss; } }
      if (best) {
        const a = Math.atan2(best.y - q.y, best.x - q.x);
        G.pbolts.push({ x: q.x, y: q.y - 6, ang: a, speed: 540, dmg: Math.round(boltDmg), t: 0, life: 1.6 });
        if (stage >= 3) G.pbolts.push({ x: q.x, y: q.y - 6, ang: a + 0.14, speed: 540, dmg: Math.round(boltDmg), t: 0, life: 1.6 });
        tone(880, 0.04, 'sine', 0.03, 120);
      }
    }
    q.skillT -= dt;
    if (q.skillT <= 0) {
      q.skillT = 9;
      const radius = stage >= 3 ? 190 : 150;
      const heal = p.maxHp * (stage >= 3 ? 0.25 : stage === 2 ? 0.2 : 0.15);
      const pdmg = (stage >= 3 ? 70 : stage === 2 ? 45 : 30) * p.dmgMul * (q.golden ? 1.5 : 1);
      p.hp = Math.min(p.maxHp, p.hp + heal);
      addFloat(p.x, p.y - 42, stage >= 3 ? '灵狐天啸！' : '灵狐护主！', '#7fe0ff', 19);
      addRing(p.x, p.y, 30, radius, 'rgba(127,224,255,0.9)');
      burst(q.x, q.y, '#7fe0ff', 20, 220);
      sfx.heal();
      for (const e of G.monsters) {
        if (e.hp > 0 && dist2(e.x, e.y, p.x, p.y) < radius * radius)
          hurtEnemy(e, pdmg, Math.atan2(e.y - p.y, e.x - p.x), 260, false);
      }
      if (G.boss && G.boss.dying < 0 && dist2(G.boss.x, G.boss.y, p.x, p.y) < radius * radius)
        bossHurt(G.boss, pdmg, rand(TAU), 0, false);
      shake(3, 0.15);
    }
  }
  // 灵宠弹
  for (let i = G.pbolts.length - 1; i >= 0; i--) {
    const q = G.pbolts[i];
    q.t += dt;
    q.x += Math.cos(q.ang) * q.speed * dt; q.y += Math.sin(q.ang) * q.speed * dt;
    let hit = q.t > q.life;
    if (!hit) for (const e of G.monsters) {
      if (e.hp <= 0) continue;
      if (dist2(q.x, q.y, e.x, e.y) < (e.r + 5) * (e.r + 5)) { hurtEnemy(e, q.dmg, q.ang, 120, false); hit = true; break; }
    }
    if (!hit && G.boss && G.boss.dying < 0 && dist2(q.x, q.y, G.boss.x, G.boss.y) < (G.boss.r + 5) * (G.boss.r + 5)) { bossHurt(G.boss, q.dmg, q.ang, 0, false); hit = true; }
    if (hit) G.pbolts.splice(i, 1);
  }

  // BOSS 技能自动施放
  for (const k2 in G.skills) {
    const sk = G.skills[k2];
    sk.cd = (sk.cd === undefined ? 0.6 : sk.cd) - dt;
    if (sk.cd <= 0 && (G.monsters.length > 0 || G.boss)) {
      const D = SKILL_POOL[k2];
      sk.cd = D.cd[Math.min(D.cd.length - 1, sk.grade)] * (sk.cdm || 1);
      castSkill(k2, sk.grade);
    }
  }
  // 蛛网减速衰减
  for (const e of G.monsters) e.slowT = Math.max(0, (e.slowT || 0) - dt);
  // 天雷引视觉
  for (let i = G.strikes.length - 1; i >= 0; i--) {
    const st = G.strikes[i];
    st.t += dt;
    if (st.t > 0.25) G.strikes.splice(i, 1);
  }
  // 梼杌地刺领域
  for (let i = G.zones.length - 1; i >= 0; i--) {
    const z = G.zones[i];
    z.t += dt;
    if (z.t >= z.delay && !z.done) {
      z.done = true;
      if (dist2(z.x, z.y, p.x, p.y) < (z.r + 10) * (z.r + 10)) hurtPlayer(z.dmg);
      burst(z.x, z.y, '#c04040', 16, 240);
      shake(3, 0.2);
    }
    if (z.t > z.delay + 0.25) G.zones.splice(i, 1);
  }

  updateBoss(dt);

  // 经验球
  for (let i = G.orbs.length - 1; i >= 0; i--) {
    const o = G.orbs[i];
    o.t += dt;
    o.x += o.vx * dt; o.y += o.vy * dt;
    o.vx *= Math.exp(-3 * dt); o.vy *= Math.exp(-3 * dt);
    const d2 = dist2(o.x, o.y, p.x, p.y);
    if (d2 < p.magnet * p.magnet) {
      const a = Math.atan2(p.y - o.y, p.x - o.x);
      const pull = 420 + (1 - Math.sqrt(d2) / p.magnet) * 500;
      o.x += Math.cos(a) * pull * dt; o.y += Math.sin(a) * pull * dt;
    }
    if (d2 < 24 * 24) {
      G.orbs.splice(i, 1);
      gainXP(o.val);
      sfx.pickup();
    }
  }
  // 灵药 / 技能卷轴
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const g = G.pickups[i];
    g.t += dt;
    if (g.kind === 'scroll') {
      const dd = Math.sqrt(dist2(g.x, g.y, p.x, p.y)) || 1;
      if (g.t > 0.8) { // 短暂闪耀后自动飞向主角，确保拾取
        const sp = Math.min(950, 260 + (g.t - 0.8) * 420);
        g.x += (p.x - g.x) / dd * sp * dt;
        g.y += (p.y - g.y) / dd * sp * dt;
      }
      if (dd < 34) {
        G.pickups.splice(i, 1);
        const gm = GRADE_META[g.grade];
        if (g.stype === 'split') {
          if (p.splitGrade < 0) {
            p.splitGrade = g.grade; p.splitBonus = 0;
            addFloat(p.x, p.y - 46, '获得「分裂剑意」·' + gm.n + '级！', gm.c, 20);
          } else if (g.grade > p.splitGrade) {
            p.splitGrade = g.grade;
            addFloat(p.x, p.y - 46, '分裂剑意 升至 ' + gm.n + ' 级！', gm.c, 20);
          } else {
            p.splitBonus = Math.min(2, (p.splitBonus || 0) + 1);
            addFloat(p.x, p.y - 46, '分裂之剑 +1！', gm.c, 18);
          }
        } else {
          const sk = G.skills[g.stype];
          if (!sk) {
            G.skills[g.stype] = { grade: g.grade, cd: 0.6, cdm: 1 };
            addFloat(p.x, p.y - 46, '获得「' + SKILL_POOL[g.stype].name + '」·' + gm.n + '级！', gm.c, 20);
          } else if (g.grade > sk.grade) {
            sk.grade = g.grade;
            addFloat(p.x, p.y - 46, SKILL_POOL[g.stype].name + ' 升至 ' + gm.n + ' 级！', gm.c, 20);
          } else {
            sk.cdm = Math.max(0.6, (sk.cdm || 1) * 0.85);
            addFloat(p.x, p.y - 46, SKILL_POOL[g.stype].name + ' 精修！', gm.c, 18);
          }
        }
        burst(p.x, p.y, gm.c, 26, 240);
        sfx.levelup();
        saveGame();
      }
      continue;
    }
    if (dist2(g.x, g.y, p.x, p.y) < 30 * 30) {
      G.pickups.splice(i, 1);
      p.hp = Math.min(p.maxHp, p.hp + 25);
      addFloat(p.x, p.y - 34, '+25', '#6aff8a', 16);
      sfx.heal();
    }
  }
    // 粒子与飘字、剑光与波纹计时
    for (let i = G.slashes.length - 1; i >= 0; i--) { const s = G.slashes[i]; s.t += dt; if (s.t > s.life) G.slashes.splice(i, 1); }
    for (let i = G.rings.length - 1; i >= 0; i--) { const r = G.rings[i]; r.t += dt; if (r.t > r.life) G.rings.splice(i, 1); }
    for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i];
    q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= Math.exp(-3.5 * dt); q.vy *= Math.exp(-3.5 * dt);
    if (q.t > q.life) G.parts.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i];
    f.t += dt; f.y -= 34 * dt;
    if (f.t > 0.8) G.floats.splice(i, 1);
  }

  updateSpawns(dt);
  if (G.clearT >= 0) {
    G.clearT -= dt;
    if (G.clearT <= 0) showClear();
  }
  checkClear();
  const zc = IS_MOBILE ? camZoomFor() : 1, hw = W / (2 * zc), hh = H / (2 * zc);
  G.camX = WORLD.w > W / zc ? clamp(p.x, hw, WORLD.w - hw) : WORLD.w / 2;
  G.camY = WORLD.h > H / zc ? clamp(p.y, hh, WORLD.h - hh) : WORLD.h / 2;
}
function bossHurt(b, dmg, ang, knock, canCrit) {
  let crit = false;
  if (canCrit && Math.random() < G.player.crit) { dmg *= 2.2; crit = true; }
  dmg = Math.round(dmg);
  b.hp -= dmg; b.flash = 0.09;
  addFloat(b.x + rand(-14, 14), b.y - b.r - 10, dmg, crit ? '#ffb020' : '#ffe9c0', crit ? 24 : 15);
  addSlash(b.x + rand(-10, 10), b.y + rand(-10, 10), ang, b.r + 10);
  burst(b.x + rand(-10, 10), b.y + rand(-10, 10), '#ffd9a0', crit ? 6 : 3, 130);
  G.hitStop = Math.max(G.hitStop, crit ? 0.03 : 0.01);
  shake(1, 0.08);
  sfx.hit();
  if (b.hp <= 0 && b.dying < 0) {
    b.hp = 0; b.dying = 0;
    shake(10, 0.6); sfx.boss();
    G.kills++;
  }
}

/* ================= 绘制：背景 ================= */
function drawBG() {
  ctx.fillStyle = '#131019';
  ctx.fillRect(0, 0, W, H);
  // 主题地砖（开源 DCSS 地板，每 10 关更换）
  const band = Math.floor((G.level - 1) / 10);
  const fl = BG_FLOORS[band % BG_FLOORS.length];
  if (fl.complete && fl.naturalWidth > 0) {
    const ts = 64;
    ctx.globalAlpha = 0.17;
    ctx.imageSmoothingEnabled = false;
    const ox = -(((G.camX - W / 2) % ts) + ts) % ts, oy = -(((G.camY - H / 2) % ts) + ts) % ts;
    for (let x = ox - ts; x < W + ts; x += ts)
      for (let y = oy - ts; y < H + ts; y += ts)
        ctx.drawImage(fl, x, y, ts, ts);
    ctx.globalAlpha = 1;
    ctx.imageSmoothingEnabled = true;
  }
  const cell = 150;
  const cx0 = Math.floor((G.camX - W / 2) / cell) - 1, cx1 = Math.floor((G.camX + W / 2) / cell) + 1;
  const cy0 = Math.floor((G.camY - H / 2) / cell) - 1, cy1 = Math.floor((G.camY + H / 2) / cell) + 1;
  for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {
    const h = hash2(cx, cy);
    const px = cx * cell + hash2(cx * 7, cy * 3) * (cell - 40) + 20 - (G.camX - W / 2);
    const py = cy * cell + hash2(cx * 3, cy * 11) * (cell - 40) + 20 - (G.camY - H / 2);
    if (h < 0.16) { // 符文圈
      ctx.strokeStyle = 'rgba(100,88,160,0.13)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, 30, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(px, py, 20, 0, TAU); ctx.stroke();
    } else if (h < 0.36) { // 灵草
      ctx.strokeStyle = 'rgba(70,90,66,0.35)'; ctx.lineWidth = 2;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(px + k * 5, py + 8);
        ctx.quadraticCurveTo(px + k * 7, py - 4, px + k * 10, py - 12); ctx.stroke();
      }
    } else if (h < 0.45) { // 山石
      ctx.fillStyle = 'rgba(52,46,70,0.8)';
      ctx.beginPath();
      ctx.moveTo(px - 12, py + 7); ctx.lineTo(px - 5, py - 8); ctx.lineTo(px + 6, py - 6); ctx.lineTo(px + 13, py + 8);
      ctx.closePath(); ctx.fill();
    } else if (h < 0.5) { // 骨花
      ctx.strokeStyle = 'rgba(120,110,140,0.16)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, 7, 0, TAU); ctx.stroke();
    }
  }
  // 暗角
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ================= 绘制：飞剑 ================= */
const ELEM = {

  ctx.strokeStyle = 'rgba(138,109,47,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(mx0, my0, mw2, mh2, 6); ctx.fill(); ctx.stroke();
  for (const e of G.monsters) {
    ctx.fillStyle = e.elite ? '#ffd860' : '#e5484d';

  if (G.boss && !G.boss.dead && G.boss.dying < 0) {
    ctx.fillStyle = '#c060ff';
    ctx.beginPath(); ctx.arc(mx0 + G.boss.x * k2, my0 + G.boss.y * k2, 3.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#7fe0ff';
  ctx.beginPath(); ctx.arc(mx0 + p.x * k2, my0 + p.y * k2, 3, 0, TAU); ctx.fill();

  if (narrow) {

    for (const id of ['big', 'rate', 'crit', 'homing', 'volley', 'aura']) {
      if ((p.upCounts[id] || 0) > 0) {
        const im = ICON_IMG[id];
        if (im && im.complete && im.naturalWidth > 0) ctx.drawImage(im, bx2, 44, 14, 14);
        bx2 += 17;

  }

  if (G.stageMsg > 0 && G.stageMsgText) {

    ctx.textAlign = 'center'; ctx.fillStyle = '#c9a0ff'; ctx.font = 'bold 19px "Kaiti SC","KaiTi",serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 4;
    ctx.strokeText(G.stageMsgText, W / 2, H * 0.3 - 60);
    ctx.fillText(G.stageMsgText, W / 2, H * 0.3 - 60);
    ctx.globalAlpha = 1;
  }
  // 灵宠提示
  if (G.petMsg > 0 && G.pet) {
    ctx.globalAlpha = clamp(G.petMsg, 0, 1);
    ctx.textAlign = 'center'; ctx.fillStyle = '#7fe0ff'; ctx.font = '16px "Kaiti SC","KaiTi",serif';
    ctx.fillText('灵宠「剑灵小白」：自动射灵弹 · 每9秒施放【灵狐护主】回复生命并震退妖物', W / 2, H - 70);
    ctx.globalAlpha = 1;

    ctx.fillText('移动鼠标指引方向 / WASD · 飞剑自动诛妖', W / 2, H - 40);
    ctx.globalAlpha = 1;
  }

  if (IS_MOBILE && G.state === 'playing' && !joy) {
    const jx = 86, jy = H - 110;
    ctx.strokeStyle = 'rgba(232,200,106,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jx, jy, 44, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(232,200,106,0.5)';
    ctx.beginPath(); ctx.arc(jx, jy, 16, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(201,191,174,0.8)'; ctx.font = '13px "Kaiti SC","KaiTi",serif'; ctx.textAlign = 'center';
    ctx.fillText('滑动移动', jx, jy + 62);

    ctx.globalAlpha = ia;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f0d890'; ctx.font = 'bold ' + Math.round((narrow ? 34 : 52) * k) + 'px "Kaiti SC","KaiTi",serif';
    ctx.fillText('第' + G.level + '关', W / 2, H * 0.3);
    ctx.fillStyle = '#c9bfae'; ctx.font = Math.round((narrow ? 17 : 26) * k) + 'px "Kaiti SC","KaiTi",serif';
    ctx.fillText(cfg.name + (cfg.boss ? ' · 妖王现世' : ''), W / 2, H * 0.3 + 40);
    if (G.level >= 100) {
      ctx.fillStyle = '#7fe0ff'; ctx.font = Math.round(16 * k) + 'px "Kaiti SC","KaiTi",serif';

    }

  if (!IS_MOBILE && G.mouse && !joy) {
    ctx.strokeStyle = 'rgba(232,200,106,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(G.mouse.x, G.mouse.y, 9, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(G.mouse.x - 14, G.mouse.y); ctx.lineTo(G.mouse.x - 5, G.mouse.y);
    ctx.moveTo(G.mouse.x + 5, G.mouse.y); ctx.lineTo(G.mouse.x + 14, G.mouse.y);
    ctx.moveTo(G.mouse.x, G.mouse.y - 14); ctx.lineTo(G.mouse.x, G.mouse.y - 5);

}
let lastT = performance.now();
function frame(now) {
  let dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now;
  if (window.__cheap) { requestAnimationFrame(frame); return; } // 冻结渲染（截图/测试用）
  // 打击顿帧：命中与击杀瞬间世界短暂放慢
  if (G.hitStop > 0) { G.hitStop -= dt; dt *= 0.15; }
  if (G.state === 'playing') update(dt);

  // 绘制
  ctx.clearRect(0, 0, W, H);
  if (G.state === 'menu') {
    G.camX = 0; G.camY = 0;
    drawBG();
    // 大剑装饰
    drawSword(W / 2, H * 0.42, Math.sin(now / 2400) * 0.3 - 0.6, Math.min(W, H) * 0.34, 0.5);
    ctx.textAlign = 'center';
  } else if (G.player) {
    const shx = G.shakeT > 0 ? rand(-1, 1) * G.shakeMag : 0;
    const shy = G.shakeT > 0 ? rand(-1, 1) * G.shakeMag : 0;
    drawBG(); // 背景与暗角画在屏幕坐标系
    ctx.save();
    const zm = IS_MOBILE ? camZoomFor() : 1;
    ctx.translate(W / 2 + shx, H / 2 + shy);
    ctx.scale(zm, zm);
    ctx.translate(-G.camX, -G.camY);
    // 妖界结界（地图边界）
    ctx.fillStyle = 'rgba(5,4,9,0.85)';
    ctx.fillRect(-9000, -9000, WORLD.w + 18000, 9000);
    ctx.fillRect(-9000, WORLD.h, WORLD.w + 18000, 9000);
    ctx.fillRect(-9000, 0, 9000, WORLD.h);
    ctx.fillRect(WORLD.w, 0, 9000, WORLD.h);
    ctx.strokeStyle = 'rgba(138,109,47,0.7)'; ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, WORLD.w - 6, WORLD.h - 6);
    ctx.strokeStyle = 'rgba(240,216,144,0.28)'; ctx.lineWidth = 2;
    ctx.strokeRect(16, 16, WORLD.w - 32, WORLD.h - 32);
    // 经验球
    for (const o of G.orbs) {
      const tw = 0.7 + Math.sin(o.t * 6) * 0.3;
      ctx.fillStyle = 'rgba(60,200,255,' + tw + ')';
      ctx.beginPath(); ctx.arc(o.x, o.y, 4.5, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(160,240,255,0.9)';
      ctx.beginPath(); ctx.arc(o.x, o.y, 2, 0, TAU); ctx.fill();
    }
    // 灵药 / 技能卷轴（开源贴图）
    for (const g of G.pickups) {
      const fl = Math.sin(g.t * 5) * 3;
      if (g.kind === 'scroll') {
        const gm = GRADE_META[g.grade];
        const si = SCROLL_IMGS[g.grade % SCROLL_IMGS.length];
        // 闪亮：脉冲光柱 + 呼吸光晕 + 环绕星芒
        const pulse = 0.6 + Math.sin(g.t * 4) * 0.4;
        const beamG = ctx.createLinearGradient(g.x, g.y - 150, g.x, g.y + 10);
        beamG.addColorStop(0, 'rgba(255,240,180,0)');
        beamG.addColorStop(1, 'rgba(255,240,180,' + (0.12 + pulse * 0.16).toFixed(3) + ')');
        ctx.fillStyle = beamG;
        ctx.fillRect(g.x - 16, g.y - 150, 32, 160);
        const gg = ctx.createRadialGradient(g.x, g.y + fl, 2, g.x, g.y + fl, 30);
        gg.addColorStop(0, 'rgba(255,245,200,' + (0.35 + pulse * 0.25).toFixed(3) + ')');
        gg.addColorStop(1, 'rgba(255,245,200,0)');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(g.x, g.y + fl, 30, 0, TAU); ctx.fill();
        ctx.save();
        ctx.translate(g.x, g.y + fl);
        ctx.rotate(g.t * 1.4);
        ctx.strokeStyle = 'rgba(255,236,170,' + (0.35 + pulse * 0.3).toFixed(3) + ')';
        ctx.lineWidth = 1.5;
        for (let k2 = 0; k2 < 4; k2++) {
          const sa = k2 / 4 * TAU;
          ctx.beginPath();
          ctx.moveTo(Math.cos(sa) * 13, Math.sin(sa) * 13);
          ctx.lineTo(Math.cos(sa) * (19 + pulse * 4), Math.sin(sa) * (19 + pulse * 4));

        }
        ctx.restore();
        ctx.save();
        ctx.translate(g.x, g.y + fl);

        }
        ctx.restore();

      }
      const pi = ITEM_IMG.potion;
      if (pi.complete && pi.naturalWidth > 0) {
        ctx.save();
        ctx.translate(g.x, g.y + fl);
        ctx.imageSmoothingEnabled = false;
        ctx.shadowColor = 'rgba(255,170,70,0.85)';
        ctx.shadowBlur = 12;
        ctx.drawImage(pi, -12, -13, 24, 24);
        ctx.restore();
      } else {
        ctx.fillStyle = '#c86a2a';
        ctx.beginPath(); ctx.arc(g.x, g.y + fl - 3, 6, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(g.x, g.y + fl + 5, 8, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,220,120,0.8)';
        ctx.fillRect(g.x - 2, g.y + fl - 11, 4, 4);
      }
    }
    // 妖弹 / 蛛丝
    for (const q of G.eprojectiles) {
      if (q.kind === 'web') {
        ctx.strokeStyle = 'rgba(235,235,245,0.55)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(q.x - q.vx * 0.05, q.y - q.vy * 0.05); ctx.lineTo(q.x, q.y); ctx.stroke();
        ctx.fillStyle = 'rgba(245,245,252,0.95)';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(220,220,235,0.7)'; ctx.lineWidth = 1;
        for (let k = 0; k < 3; k++) {
          const wa = k / 3 * TAU + q.t * 4;
          ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x + Math.cos(wa) * (q.r + 4), q.y + Math.sin(wa) * (q.r + 4)); ctx.stroke();
        }
      } else if (q.kind === 'venom') {
        ctx.fillStyle = 'rgba(150,80,220,0.35)';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r + 4, 0, TAU); ctx.fill();
        ctx.fillStyle = '#9a50e0';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e8d0ff';
        ctx.beginPath(); ctx.arc(q.x - 2, q.y - 2, q.r * 0.4, 0, TAU); ctx.fill();
      } else if (q.kind === 'fire') {
        ctx.fillStyle = 'rgba(255,140,50,0.3)';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r + 4 + Math.sin(q.t * 12) * 1.5, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ff8830';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ffe08a';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r * 0.5, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(216,232,88,0.4)';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r + 3, 0, TAU); ctx.fill();
        ctx.fillStyle = '#d8e858';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
        ctx.fillStyle = '#8aa030';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r * 0.45, 0, TAU); ctx.fill();
      }
    }
    // 梼杌地刺领域
    for (const z of G.zones) {
      const kFill = Math.min(1, z.t / z.delay);
      ctx.fillStyle = 'rgba(255,60,60,' + (0.08 + 0.2 * kFill).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,70,70,' + (0.45 + 0.4 * kFill).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * (0.4 + 0.6 * kFill), 0, TAU); ctx.stroke();
    }
    // 妖怪
    for (const e of G.monsters) drawMon(e);
    drawBoss(G.boss);
    // 玩家
    drawPlayer(G.player);
    // 灵宠与灵弹
    if (G.pet) drawPet(G.pet);
    for (const q of G.pbolts) {
      ctx.fillStyle = q.color || 'rgba(127,224,255,0.9)';
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r || 3.5, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(240,252,255,0.9)';

      const fs = f.scale || 1;

        ctx.strokeStyle = 'rgba(' + tc + ',' + (0.4 * (1 - i / f.trail.length) * fs).toFixed(3) + ')';
        ctx.lineWidth = (f.len * 0.16 * (1 - i / f.trail.length) + 2) * fs;

        ctx.beginPath(); ctx.moveTo(tp.x, tp.y); ctx.lineTo(tp2.x, tp2.y); ctx.stroke();

    for (const s of G.slashes) {
      const k = 1 - s.t / s.life;
      ctx.strokeStyle = 'rgba(210,240,255,' + (0.75 * k).toFixed(3) + ')';
      ctx.lineWidth = 3 + 5 * k;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + (1 - k) * 12, s.ang - 0.9, s.ang + 0.9);

    }
    for (const r of G.rings) {
      const k = r.t / r.life;
      ctx.globalAlpha = (1 - k) * 0.8;

      ctx.lineWidth = 3 * (1 - k) + 1;

/* ================= 按钮绑定 ================= */
$('btn-next').onclick = () => startLevel(G.level + 1, true);

const btnContinue = $('btn-continue'), btnNew = $('btn-new');

  btnContinue.style.display = has ? '' : 'none';
  btnNew.style.display = has ? '' : 'none';

let newConfirm = false;
btnNew.onclick = () => {
  if (!newConfirm) { newConfirm = true; btnNew.classList.add('confirm'); btnNew.textContent = '确认重来？'; setTimeout(() => { newConfirm = false; btnNew.classList.remove('confirm'); btnNew.textContent = '重新修行'; }, 2500); return; }

const nameInput = $('name-input');

nameInput.addEventListener('change', () => {
  localStorage.setItem('yujian_name', nameInput.value.trim());
});

  renderRank(playerName());
  showScreen('scr-rank');
};
$('btn-rank-refresh').onclick = () => { renderRank(playerName()); };
$('btn-lb-token').onclick = () => {
  const v = $('lb-token-input').value.trim();
  if (v) { localStorage.setItem('yujian_lb_token', v); $('lb-token-input').value = ''; }

$('btn-rank-back').onclick = () => { showScreen('scr-menu'); };
buildMenu();
refreshSaveRow();
requestAnimationFrame(frame);

// 调试钩子（试玩/自动化测试用）
window.G = G; window.startRun = startRun; window.startLevel = startLevel;
